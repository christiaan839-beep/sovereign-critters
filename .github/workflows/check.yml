name: check

on:
  push:
  pull_request:

# A read-only token: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Pinned to the version the plugins were last verified against; bump it on purpose, in its own commit.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      # Validates and tests the root and all nine plugins, checks the sounds, and scans for home paths, model ids,
      # secret-shaped strings, emails and merge markers. Exits non-zero on any real failure.
      - name: Preflight
        run: bash tools/preflight.sh
