name: check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [critter-buddy, build-bell, session-diary, forge, stunt, crab, guard, everywhere]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Validate the marketplace
        run: claude plugin validate . --strict
      - name: Validate and test ${{ matrix.plugin }}
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          claude plugin validate . --strict
          claude plugin test .
